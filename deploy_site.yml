---
- name: Déployer un site HTML custom
  hosts: webservers
  become: yes

  tasks:
    - name: Template index.html
      template:
        src: templates/index.html.j2
        dest: /usr/share/nginx/html/index.html
        mode: '0644'
      notify: restart nginx

  handlers:
    - name: restart nginx
      service:
        name: nginx
        state: restarted
